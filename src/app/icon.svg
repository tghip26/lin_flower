<svg width="32" height="32" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lfGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="35%" stop-color="#e63963" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="lfRosePetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e63963" />
    </linearGradient>

    <linearGradient id="lfLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  {/* Outer Circular Ring with Dual Gold Border */}
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="url(#lfGoldGrad)" stroke-width="6" />
  <circle cx="100" cy="100" r="84" fill="#fffdfa" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="4 4" />

  {/* Outer Leaves Branch Accents */}
  <path d="M 100,14 C 90,6 75,18 90,26 Z" fill="url(#lfLeafGrad)" />
  <path d="M 100,14 C 110,6 125,18 110,26 Z" fill="url(#lfLeafGrad)" />
  <path d="M 100,186 C 90,194 75,182 90,174 Z" fill="url(#lfLeafGrad)" />
  <path d="M 100,186 C 110,194 125,182 110,174 Z" fill="url(#lfLeafGrad)" />

  {/* Monogram Letter L */}
  <path
    d="M 68,54 C 68,50 72,46 76,46 L 76,132 C 76,144 84,148 106,148 L 128,148 C 134,148 138,152 138,156 C 138,160 134,162 124,162 L 72,162 C 62,162 58,156 58,146 L 58,62 C 58,54 62,54 68,54 Z"
    fill="url(#lfGoldGrad)"
  />

  {/* Monogram Letter F */}
  <path
    d="M 104,54 C 104,48 110,46 122,46 L 146,46 C 152,46 156,50 156,54 C 156,58 152,60 144,60 L 120,60 L 120,94 L 138,94 C 144,94 148,98 148,102 C 148,106 144,108 138,108 L 120,108 L 120,146 C 120,154 114,158 108,158 C 104,158 104,152 104,146 Z"
    fill="#be185d"
  />

  {/* Integrated Blooming Rose Flower Icon at Center (X=100, Y=100) */}
  <g transform="translate(100, 100)">
    <circle r="22" fill="#f43f5e" opacity="0.25" />
    <circle cx="11" cy="0" r="7.5" fill="url(#lfRosePetalGrad)" />
    <circle cx="5.5" cy="9.5" r="7.5" fill="url(#lfRosePetalGrad)" />
    <circle cx="-5.5" cy="9.5" r="7.5" fill="url(#lfRosePetalGrad)" />
    <circle cx="-11" cy="0" r="7.5" fill="url(#lfRosePetalGrad)" />
    <circle cx="-5.5" cy="-9.5" r="7.5" fill="url(#lfRosePetalGrad)" />
    <circle cx="5.5" cy="-9.5" r="7.5" fill="url(#lfRosePetalGrad)" />
    <circle r="5" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
  </g>
</svg>
